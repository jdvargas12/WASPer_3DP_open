name: WASPer_3DP
version: 1.0.4.7
authors:
  - Juan Diego Vargas
website: https://www.linkedin.com/in/juan-diego-vargas-vel/
description: |
  WASPer_3DP is a Grasshopper plugin for planar 3D printing using LDM technologies like the WASP40100. It includes components for slicing, generating Marlin G-code, path optimization, and water need calculations for large-scale, clay-based, and viscous material printing.
keywords:
  - Planar_3D_printing
  - G_code
  - LDM
  - path_optimization
  - Heat_transfer 
platform: any
rhino: "8.0"
rhino_version: ">=8.0.0 <9.0.0"
